name: CI
on:
  push:
    branches:
      - main
  pull_request:
    # Run for all pull requests, regardless of target branch

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.87.0
jobs:
  test:
    name: Build, Lint & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install ${{ env.RUST_VERSION }} --component clippy --component rustfmt && rustup default ${{ env.RUST_VERSION }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
      - name: Build
        run: cargo build --all-features
      - name: Run tests
        run: cargo test --all-features
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Run fmt
        run: cargo fmt --all -- --check
      - name: Build and Test wasm
        run: npm install && npm run build && npm test
      - name: Run Windows path diagnostic (Windows only)
        if: matrix.os == 'windows-latest'
        run: node test-module-details.mjs
      - name: Test module-details-from-path on Windows
        if: matrix.os == 'windows-latest'
        run: node test-module-details-windows.mjs
      # This check is currently failing even after updating the license file.
      # - name: Install license tool
      #   run: cargo install dd-rust-license-tool
      # - name: Run license tool
      #   run: dd-rust-license-tool check
